<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앵무낚시</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b2233;--ink:#fff;--gold:#ffd24a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#w{position:relative;height:100%;max-width:100%;aspect-ratio:4/7;max-height:100%}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,30,48,.86);color:var(--ink);text-align:center;padding:20px;font-size:clamp(12px,3.4vw,16px);line-height:1.5}
.ov h1{margin:0;font-size:clamp(28px,9vw,44px)}
.ov p{margin:0}.s{font-size:.9em;opacity:.85}
.ov .big{font-size:clamp(28px,9vw,44px)}
button{font:inherit;font-weight:800;font-size:1.2em;padding:12px 32px;border:0;border-radius:999px;background:var(--gold);color:#3a2600;cursor:pointer;margin-top:8px}
button:active{transform:scale(.96)}
.hide{display:none}
</style></head><body>
<div id="w">
<canvas id="c"></canvas>
<div id="start" class="ov">
<h1>🦜 앵무낚시 🎣</h1>
<p>배 위의 앵무새가 여행 기념품만 쏙쏙!<br>쓰레기는 피하세요.</p>
<p class="s">🐚 +10 · 🕶️ +20 · 🗺️ +40 · 📘✨ +80<br>🥫 👢 -15 · 🪼 줄에 닿으면 게이지 -20%</p>
<p class="s">⏱️ 60초 안에 150점을 넘기면 승리!<br>놓침이 3번이면 패배 ❤️❤️❤️</p>
<p class="s"><b>PC</b> ←→ 또는 마우스로 이동 · 클릭/스페이스로 줄 내리기<br><b>폰</b> 원하는 곳을 탭하면 이동해서 줄을 내려요<br>낚는 중엔 꾹 누르면 초록 바가 오르고, 떼면 내려가요</p>
<button id="go">게임 시작</button>
</div>
<div id="end" class="ov hide">
<div class="big" id="et"></div>
<p id="em"></p>
<div class="big" id="es"></div>
<p id="esc"></p>
<button id="again">다시 하기</button>
</div>
</div>
<script>
const W=400,H=700,TARGET=150,TIME=60,BH=.24;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;g.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
addEventListener('resize',fit);
const TY={
shell:{e:'🐚',pts:10,y:[230,350],d:1},
glass:{e:'🕶️',pts:20,y:[370,490],d:1.25},
map:{e:'🗺️',pts:40,y:[510,640],d:1.5},
pass:{e:'📘',pts:80,y:[520,640],d:1.9},
trash1:{e:'🥫',pts:-15,y:[230,640],d:1,trash:1},
trash2:{e:'👢',pts:-15,y:[230,640],d:1,trash:1},
jelly:{e:'🪼',y:[300,640],jelly:1}};
const QUIP={shell:'바다의 속삭임 한 줌, 조개 득템!',glass:'휴양지의 정석, 멋쟁이 선글라스!',map:'보물 지도다! 다음 여행지는 어디?',pass:'황금 여권이라니! 전설의 여행자!'};
let S,held=false,keys={l:0,r:0};
function reset(){S={mode:'start',t:0,score:0,lives:3,combo:0,items:[],spawn:0,px:200,endIn:0,fx:[],mood:{k:'',msg:'',t:0},fight:null,line:{st:'idle',x:200,y:148,hook:null}};for(let i=0;i<5;i++)spawn(true)}
function spawn(init){
 const d=S.t/TIME;
 const w=[['shell',30*(1-.6*d)],['glass',22],['map',10+14*d],['pass',2+4*d],['trash',18],['jelly',6+18*d]];
 let r=Math.random()*w.reduce((a,b)=>a+b[1],0),k='shell';
 for(const x of w){if((r-=x[1])<=0){k=x[0];break}}
 if(k==='trash')k=Math.random()<.5?'trash1':'trash2';
 const T=TY[k],dir=Math.random()<.5?1:-1,sp=(35+Math.random()*35)*(1+d*.9);
 S.items.push({k,t:T,x:init?rand(30,370):(dir>0?-30:430),v:dir*sp,y:rand(T.y[0],T.y[1]),yy:0,ph:rand(0,6),cd:0});
}
function lower(){const L=S.line;L.st='down';L.x=S.px;L.y=132;L.hook=null}
function act(){
 if(S.mode!=='play'||S.endIn>0)return;
 if(S.line.st==='idle')lower();else if(S.line.st==='down')S.line.st='up';
}
function mood(k,msg){S.mood={k,msg,t:2}}
function fx(txt,x,y,c){S.fx.push({txt,x:x??S.px,y:y??88,t:1.1,c:c||'#ffd24a'})}
function hook(it){
 const L=S.line;L.hook=it;S.items.splice(S.items.indexOf(it),1);L.st='fight';
 S.fight={bar:.38,v:0,fp:.5,tgt:.5,tt:0,prog:.3,fish:Math.random()<.5?'🐟':'🐠'};
}
function update(dt){
 const d=S.t/TIME,L=S.line;
 S.mood.t-=dt;S.fx=S.fx.filter(f=>(f.t-=dt)>0);
 if(S.endIn>0){S.endIn-=dt;if(S.endIn<=0)end(false);return}
 S.t+=dt;if(S.t>=TIME){S.t=TIME;end(false);return}
 if(L.st==='idle')S.px=clamp(S.px+(keys.r-keys.l)*260*dt,30,370);
 S.spawn-=dt;if(S.spawn<=0&&S.items.length<9){spawn();S.spawn=1-.35*d}
 for(const it of S.items){it.x+=it.v*dt;it.yy=it.y+Math.sin(S.t*2+it.ph)*8;it.cd-=dt}
 S.items=S.items.filter(it=>it.x>-50&&it.x<450);
 const tryHook=()=>{for(const it of S.items){if(it.t.jelly)continue;if(Math.hypot(it.x-L.x,it.yy-(L.y+10))<28){hook(it);return}}};
 if(L.st==='down'){L.y+=380*dt;tryHook();if(L.st==='down'&&L.y>=660)L.st='up'}
 else if(L.st==='up'){L.y-=520*dt;if(!L.hook)tryHook();
  if(L.st==='up'&&L.y<=132){L.y=148;resolve()}}
 else if(L.st==='fight'){
  const f=S.fight,it=L.hook,dm=it.t.d*(1+.8*d);
  f.v=clamp(f.v+(held?3.4:-2.8)*dt,-1.6,1.6);f.bar+=f.v*dt;
  if(f.bar<0){f.bar=0;f.v=Math.abs(f.v)*.3}
  if(f.bar>1-BH){f.bar=1-BH;f.v=-Math.abs(f.v)*.3}
  f.tt-=dt;if(f.tt<=0){f.tgt=rand(.08,.92);f.tt=rand(.5,1.1)/dm}
  const st=.45*dm*dt,df=f.tgt-f.fp;f.fp=Math.abs(df)<st?f.tgt:f.fp+Math.sign(df)*st;
  const inside=f.fp>=f.bar&&f.fp<=f.bar+BH;
  f.prog+=(inside?.3:-.2)*dt;
  for(const j of S.items){if(j.t.jelly&&j.cd<=0&&Math.abs(j.x-L.x)<26&&Math.abs(j.yy-L.y)<30){f.prog-=.2;j.cd=1.5;fx('-20%',L.x,L.y-30,'#ff6b8b')}}
  if(f.prog>=1){L.st='up'}
  else if(f.prog<=0){L.hook=null;L.st='up';S.lives--;S.combo=0;mood('bad','푸하하! 놓쳤네~ 배나 긁어야지!');if(S.lives<=0)S.endIn=1.3}
 }
}
function resolve(){
 const L=S.line,it=L.hook;L.st='idle';L.hook=null;
 if(!it)return;
 if(it.t.trash){S.score=Math.max(0,S.score+it.t.pts);S.combo=0;mood('bad','으엑, 쓰레기잖아! 이건 아니야~');fx('-15','','','#ff6b8b')}
 else{S.score+=it.t.pts;S.combo++;mood('ok',QUIP[it.k]);fx('+'+it.t.pts)}
 if(S.score>=TARGET)end(true);
}
function end(win){
 if(S.mode!=='play')return;S.mode='end';held=false;
 const n=win?Math.max(1,S.lives):0;
 $('et').textContent=win?'🎉 승리!':'😵 아쉬워요';
 $('em').textContent=win?'앵무새가 기념품을 가득 챙겼어요!':(S.lives<=0?'3번 놓쳐서 낚시가 끝났어요.':'시간이 다 됐어요. 목표 점수에 닿지 못했어요.');
 $('es').innerHTML=[0,1,2].map(i=>'<span style="opacity:'+(i<n?1:.25)+'">⭐</span>').join('');
 $('esc').textContent='최종 점수 '+S.score+' / 목표 '+TARGET+'점';
 $('end').classList.remove('hide');
}
function start(){reset();S.mode='play';$('start').classList.add('hide');$('end').classList.add('hide')}
$('go').onclick=start;$('again').onclick=start;

function E(e,x,y,s,a=1,r=0){g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(r);g.font=s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,0,0);g.restore()}
function T(t,x,y,s,c='#fff',al='center'){g.font='800 '+s+'px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(t,x,y)}
function rr(x,y,w,h,r,c){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill()}
function draw(){
 const t=S.t,L=S.line,tt=performance.now()/1000;
 let gr=g.createLinearGradient(0,0,0,150);gr.addColorStop(0,'#7fd0ff');gr.addColorStop(1,'#d8f3ff');g.fillStyle=gr;g.fillRect(0,0,W,150);
 gr=g.createLinearGradient(0,150,0,H);gr.addColorStop(0,'#35b4e0');gr.addColorStop(.5,'#1478ad');gr.addColorStop(1,'#08284a');g.fillStyle=gr;g.fillRect(0,150,W,H-150);
 E('☀️',56,78,46);E('☁️',((tt*9)%520)-60,66,44,.9);E('☁️',((tt*6+260)%520)-60,98,36,.8);E('🌴',366,128,50);
 for(let x=0;x<W+40;x+=40)E('🌊',x+Math.sin(tt*2+x)*5,152,26,.9);
 rr(24,130,352,10,5,'#8a5a2b');E('⛵',200,98,62);
 for(const it of S.items){
  const y=it.yy||it.y;
  if(it.k==='pass'){const rg=g.createRadialGradient(it.x,y,2,it.x,y,30);rg.addColorStop(0,'rgba(255,215,80,.8)');rg.addColorStop(1,'rgba(255,215,80,0)');g.fillStyle=rg;g.fillRect(it.x-32,y-32,64,64);E('📘',it.x,y,36);E('✨',it.x+14,y-14,22,.5+.5*Math.sin(tt*9));E('✨',it.x-14,y+12,16,.5+.5*Math.cos(tt*7))}
  else E(it.t.e,it.x,y,it.t.jelly?38:34,it.t.jelly?.85:1,it.t.jelly?Math.sin(tt*3+it.ph)*.15:0);
 }
 // parrot + line
 const fighting=L.st==='fight',sh=fighting?Math.sin(tt*45)*3:0;
 const lx=L.st==='idle'?S.px:L.x,ly=L.st==='idle'?148:L.y,hx=lx+sh;
 g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=2;g.beginPath();g.moveTo(lx,132);g.lineTo(hx,ly);g.stroke();
 g.strokeStyle='#e8e8e8';g.lineWidth=3;g.beginPath();g.arc(hx+5,ly+4,5,-.6,Math.PI*1.1);g.stroke();
 if(L.hook)E(L.hook.t.e,hx,ly+22,34,1,fighting?Math.sin(tt*30)*.3:0);
 const bad=S.mood.t>0&&S.mood.k==='bad',ok=S.mood.t>0&&S.mood.k==='ok';
 E('🦜',S.px,108,42,1,bad?Math.sin(tt*30)*.28:0);
 E('🎣',S.px+26,108,28,1,fighting?Math.sin(tt*40)*.25:0);
 if(ok)E('🎉',S.px-26,82,28);
 if(bad){E('😵',S.px-26,82,28);T('벅벅',S.px+2,134,12,'#fff')}
 if(S.mood.t>0&&S.mood.msg){
  g.font='800 14px sans-serif';const w=Math.min(g.measureText(S.mood.msg).width+24,W-16),bx=clamp(S.px-w/2,8,W-8-w);
  rr(bx,50,w,30,12,'#fff');g.beginPath();g.moveTo(S.px-6,80);g.lineTo(S.px,88);g.lineTo(S.px+6,80);g.fill();
  T(S.mood.msg,bx+w/2,65,13,'#2a2a2a');
 }
 // fight panel
 if(fighting){const f=S.fight,ox=lx>200?8:268;
  rr(ox,236,124,364,16,'rgba(5,25,45,.82)');T('낚는 중!',ox+62,252,13,'#ffd24a');
  rr(ox+14,268,46,300,8,'#16384f');
  rr(ox+14,268+300*(1-f.bar-BH),46,300*BH,8,'rgba(80,225,110,.92)');
  E(f.fish,ox+37,268+300*(1-f.fp),30);
  rr(ox+76,268,26,300,8,'#16384f');const ph=300*clamp(f.prog,0,1);rr(ox+76,568-ph,26,ph,8,'#ffd24a');
  T('꾹 누르면 ↑ 떼면 ↓',ox+62,586,11,'#cfe8f5');}
 for(const f of S.fx){g.globalAlpha=clamp(f.t,0,1);T(f.txt,f.x,f.y-(1.1-f.t)*40,22,f.c);g.globalAlpha=1}
 // HUD
 g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,0,W,44);
 E('⏱️',22,22,22);T(Math.ceil(TIME-t)+'초',42,23,18,'#fff','left');
 T('점수 '+S.score+' / '+TARGET,200,23,18,'#ffd24a');
 for(let i=0;i<3;i++)E(i<S.lives?'❤️':'🤍',306+i*30,23,24);
 if(S.combo>=3)T('🔥 콤보 x'+S.combo,12,62,15,'#ffb347','left');
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(S.mode==='play')update(dt);draw();requestAnimationFrame(loop)}
function px(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)*W/r.width}
cv.addEventListener('pointerdown',e=>{e.preventDefault();held=true;if(S.mode==='play'&&S.line.st==='idle'&&S.endIn<=0)S.px=clamp(px(e),30,370);act()});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>held=false));
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&S.mode==='play'&&S.line.st==='idle')S.px=clamp(px(e),30,370)});
addEventListener('keydown',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=1;e.preventDefault()}
 else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=1;e.preventDefault()}
 else if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();if(!e.repeat){held=true;act()}}
});
addEventListener('keyup',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=0;
 else if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=0;
 else if(e.code==='Space'||e.code==='ArrowDown')held=false;
});
reset();fit();requestAnimationFrame(loop);
</script></body></html>
