<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b2233;--ink:#fff;--gold:#ffd24a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#w{position:relative;height:100%;max-width:100%;aspect-ratio:4/7;max-height:100%}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,30,48,.86);color:var(--ink);text-align:center;padding:20px;font-size:clamp(12px,3.4vw,16px);line-height:1.5}
.ov h1{margin:0;font-size:clamp(28px,9vw,44px)}
.ov p{margin:0}.s{font-size:.9em;opacity:.85}
.ov .big{font-size:clamp(28px,9vw,44px)}
.ov{overflow-y:auto;justify-content:safe center;gap:8px}
input.nm{font:inherit;font-size:1.05em;text-align:center;width:9em;padding:8px 10px;border-radius:10px;border:2px solid #6aa7c8;background:#0e2a3a;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chips button.chip{font-size:.95em;padding:8px 12px;margin:0;background:#2a5a7a;color:#fff}
.chips button.chip.on{background:var(--gold);color:#3a2600}
.rk{width:min(94%,310px);text-align:left;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;font-size:.88em;line-height:1.55}
.rk div{display:flex;justify-content:space-between;gap:8px}.rk .me{color:var(--gold);font-weight:800}
button{font:inherit;font-weight:800;font-size:1.2em;padding:12px 32px;border:0;border-radius:999px;background:var(--gold);color:#3a2600;cursor:pointer;margin-top:8px}
button:active{transform:scale(.96)}
.hide{display:none}

let S,held=false,keys={l:0,r:0};
function reset(){S={mode:'start',t:0,score:0,lives:3,combo:0,items:[],spawn:0,px:200,endIn:0,fx:[],mood:{k:'',msg:'',t:0},fight:null,line:{st:'idle',x:200,y:148,hook:null}};for(let i=0;i<5;i++)spawn(true)}
function spawn(init){
 const d=S.t/TIME;
 const w=[['shell',30*(1-.6*d)],['glass',22],['map',10+14*d],['pass',2+4*d],['trash',18*LVP[LV].hz],['jelly',(6+18*d)*LVP[LV].hz]];
 let r=Math.random()*w.reduce((a,b)=>a+b[1],0),k='shell';
 for(const x of w){if((r-=x[1])<=0){k=x[0];break}}
 if(k==='trash')k=Math.random()<.5?'trash1':'trash2';
 const T=TY[k],dir=Math.random()<.5?1:-1,sp=(35+Math.random()*35)*(1+d*.9)*LVP[LV].sp;
 S.items.push({k,t:T,x:init?rand(30,370):(dir>0?-30:430),v:dir*sp,y:rand(T.y[0],T.y[1]),yy:0,ph:rand(0,6),cd:0});
}
function lower(){const L=S.line;L.st='down';L.x=S.px;L.y=132;L.hook=null}
function act(){
 if(S.mode!=='play'||S.endIn>0)return;
 if(S.line.st==='idle')lower();else if(S.line.st==='down')S.line.st='up';
}
function mood(k,msg){S.mood={k,msg,t:2}}
function fx(txt,x,y,c){S.fx.push({txt,x:x??S.px,y:y??88,t:1.1,c:c||'#ffd24a'})}
function hook(it){
 const L=S.line;L.hook=it;S.items.splice(S.items.indexOf(it),1);L.st='fight';
 S.fight={bar:.38,v:0,fp:.5,tgt:.5,tt:0,prog:.3,fish:Math.random()<.5?'fish1':'fish2'};
}
function update(dt){
 const d=S.t/TIME,L=S.line;
 S.mood.t-=dt;S.fx=S.fx.filter(f=>(f.t-=dt)>0);
 if(S.endIn>0){S.endIn-=dt;if(S.endIn<=0)end(false);return}
 S.t+=dt;if(S.t>=TIME){S.t=TIME;end(false);return}
 if(L.st==='idle')S.px=clamp(S.px+(keys.r-keys.l)*260*dt,30,370);
 S.spawn-=dt;if(S.spawn<=0&&S.items.length<9){spawn();S.spawn=1-.35*d}
 for(const it of S.items){it.x+=it.v*dt;it.yy=it.y+Math.sin(S.t*2+it.ph)*8;it.cd-=dt}
 S.items=S.items.filter(it=>it.x>-50&&it.x<450);
 const tryHook=()=>{for(const it of S.items){if(it.t.jelly)continue;if(Math.hypot(it.x-L.x,it.yy-(L.y+10))<28){hook(it);return}}};
 if(L.st==='down'){L.y+=380*dt;tryHook();if(L.st==='down'&&L.y>=660)L.st='up'}
 else if(L.st==='up'){L.y-=520*dt;if(!L.hook)tryHook();
  if(L.st==='up'&&L.y<=132){L.y=148;resolve()}}
 else if(L.st==='fight'){
  const f=S.fight,it=L.hook,dm=it.t.d*(1+.8*d)*LVP[LV].sp;
  f.v=clamp(f.v+(held?3.4:-2.8)*dt,-1.6,1.6);f.bar+=f.v*dt;
  if(f.bar<0){f.bar=0;f.v=Math.abs(f.v)*.3}
  if(f.bar>1-BH){f.bar=1-BH;f.v=-Math.abs(f.v)*.3}
  f.tt-=dt;if(f.tt<=0){f.tgt=rand(.08,.92);f.tt=rand(.5,1.1)/dm}
  const st=.45*dm*dt,df=f.tgt-f.fp;f.fp=Math.abs(df)<st?f.tgt:f.fp+Math.sign(df)*st;
  const inside=f.fp>=f.bar&&f.fp<=f.bar+BH;
  f.prog+=(inside?.3:-.2)*dt;
  for(const j of S.items){if(j.t.jelly&&j.cd<=0&&Math.abs(j.x-L.x)<26&&Math.abs(j.yy-L.y)<30){f.prog-=.2;j.cd=1.5;fx('-20%',L.x,L.y-30,'#ff6b8b')}}
  if(f.prog>=1){L.st='up'}
  else if(f.prog<=0){L.hook=null;L.st='up';S.lives--;S.combo=0;mood('bad','푸하하! 놓쳤네~ 배나 긁어야지!');if(S.lives<=0)S.endIn=1.3}
 }
}
function resolve(){
 const L=S.line,it=L.hook;L.st='idle';L.hook=null;
 if(!it)return;
 if(it.t.trash){S.score=Math.max(0,S.score+it.t.pts);S.combo=0;mood('bad','으엑, 쓰레기잖아! 이건 아니야~');fx('-15','','','#ff6b8b')}
 else{S.score+=it.t.pts;S.combo++;mood('ok',QUIP[it.k]);fx('+'+it.t.pts)}
 if(S.score>=TARGET)end(true);
}
function end(win){
 if(S.mode!=='play')return;S.mode='end';held=false;
 const n=win?Math.max(1,S.lives):0;
 $('et').textContent=win?'🎉 승리!':'😵 아쉬워요';
 $('em').textContent=win?'앵무새가 기념품을 가득 챙겼어요!':(S.lives<=0?'3번 놓쳐서 낚시가 끝났어요.':'시간이 다 됐어요. 목표 점수에 닿지 못했어요.');
 $('es').innerHTML=[0,1,2].map(i=>'<span style="opacity:'+(i<n?1:.25)+'">⭐</span>').join('');
 $('esc').textContent='최종 점수 '+S.score+' / 목표 '+TARGET+'점';
 renderRank($('rk2'),addRank(win));$('end').classList.remove('hide');
}
function start(){setName();BH=LVP[LV].bh;reset();S.mode='play';$('start').classList.add('hide');$('end').classList.add('hide')}
$('go').onclick=start;$('again').onclick=start;

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(S.mode==='play')update(dt);draw();requestAnimationFrame(loop)}
function px(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)*W/r.width}
cv.addEventListener('pointerdown',e=>{e.preventDefault();held=true;if(S.mode==='play'&&S.line.st==='idle'&&S.endIn<=0)S.px=clamp(px(e),30,370);act()});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>held=false));
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&S.mode==='play'&&S.line.st==='idle')S.px=clamp(px(e),30,370)});
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=1;e.preventDefault()}
 else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=1;e.preventDefault()}
 else if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();if(!e.repeat){held=true;act()}}
});
addEventListener('keyup',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=0;
 else if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=0;
 else if(e.code==='Space'||e.code==='ArrowDown')held=false;
});
const RK='parrotFishingRank',NK='parrotFishingName';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let NAME=(lsGet(NK)||'앵무새').slice(0,8);
function ranks(){try{const a=JSON.parse(lsGet(RK));return Array.isArray(a)?a:[]}catch(e){return[]}}
function addRank(win){const a=ranks(),id=Date.now();a.push({n:NAME,s:S.score,lv:LV,w:win,id});a.sort((x,y)=>y.s-x.s||(y.lv||0)-(x.lv||0)||x.id-y.id);lsSet(RK,JSON.stringify(a.slice(0,20)));return id}
function renderRank(el,id){
 const a=ranks();let h='<b>🏆 랭킹 TOP 5</b> <span style="opacity:.6;font-size:.85em">(이 기기 기록)</span>';
 if(!a.length)h+='<div><span>아직 기록이 없어요</span></div>';
 a.slice(0,5).forEach((r,i)=>{h+='<div class="'+(r.id===id?'me':'')+'"><span>'+(i+1)+'위 '+esc(r.n)+'</span><span>'+r.s+'점 ('+(r.lv?r.lv+'단계':'이전')+(r.w?'·승리':'')+')</span></div>'});
 const mi=a.findIndex(r=>r.id===id);if(mi>=5)h+='<div class="me"><span>내 순위 '+(mi+1)+'위</span><span></span></div>';
 el.innerHTML=h;
}
function setName(){NAME=(document.querySelector('.nm').value.trim()||'앵무새').slice(0,8);lsSet(NK,NAME)}
document.querySelectorAll('.nm').forEach(i=>{i.value=NAME;i.addEventListener('input',()=>document.querySelectorAll('.nm').forEach(o=>{if(o!==i)o.value=i.value}))});
const LVS=[[1,'1단계 쉬움'],[2,'2단계 보통'],[3,'3단계 어려움']];
LV=[1,2,3].includes(+lsGet('parrotFishingLv'))?+lsGet('parrotFishingLv'):2;
function mark(){document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',+b.dataset.v===LV))}
document.querySelectorAll('.chips').forEach(c=>LVS.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.dataset.v=v;b.onclick=()=>{LV=v;lsSet('parrotFishingLv',v);mark()};c.appendChild(b)}));
mark();renderRank($('rk1'),null);
reset();fit();requestAnimationFrame(loop);
